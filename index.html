    <template id="page-research">
        <div class="container mx-auto px-6 py-16">
            <div class="max-w-3xl mx-auto text-center mb-16">
                <h1 class="text-4xl md:text-5xl font-bold text-text-dark mb-4 scroll-fade">Research</h1>
                <p class="text-lg text-text-light scroll-fade delay-1">Work on whether we can trust what a language model says, and how we would know. Plus independent policy and safety analysis.</p>
            </div>

            <ol class="research-list max-w-4xl mx-auto">
                <li class="research-item scroll-fade">
                    <div class="research-meta">
                        <span class="research-venue">NeurIPS 2026</span>
                        <span class="research-status is-review">Under review</span>
                    </div>
                    <h2 class="research-title">Auditing LLM Comparative Judges Against an External Latent Criterion</h2>
                    <p class="research-authors">With Ummugul Bezirhan and Matthias von Davier</p>
                    <p class="research-summary">Audited an LLM pairwise judge across 12,804 item pairs, each presented in both orders, against withheld operational IRT difficulty. Reversing presentation order changed 11.06% of judgments, and that instability was concentrated among near-ties, accounting for roughly 95% of observed intransitivity. Filtering the unstable judgments produced near-perfect transitivity without improving criterion validity. A more internally consistent judge is not a more valid one.</p>
                    <p class="research-note">Paper held back until review completes.</p>
                </li>

                <li class="research-item scroll-fade">
                    <div class="research-meta">
                        <span class="research-venue">NCME 2027</span>
                        <span class="research-status is-review">Submitted</span>
                    </div>
                    <h2 class="research-title">Designing Efficient LLM Comparative Judgment Networks for Item Difficulty Estimation</h2>
                    <p class="research-authors">With Ummugul Bezirhan and Matthias von Davier</p>
                    <p class="research-summary">Evaluated how anchor information and comparison-network design affect LLM-based item-difficulty estimation, across 1,351 Bradley-Terry fits over 28 network designs. Explicit calibrated anchor information improved scale recovery without improving rank recovery. Sparse networks, at 22% of the full comparison budget, retained 98% of rank correlation but produced badly overdispersed estimates. An efficient ranking design should not be mistaken for calibrated measurement.</p>
                    <p class="research-note">Paper held back until review completes.</p>
                </li>

                <li class="research-item scroll-fade">
                    <div class="research-meta">
                        <span class="research-venue">Independent</span>
                        <span class="research-status">July 2026</span>
                    </div>
                    <h2 class="research-title">Kosovo Education Policy Analysis: The Enthusiasm and Achievement Paradox</h2>
                    <p class="research-summary">Kosovo's Grade 4 students report some of the highest learning motivation in the world, and some of the lowest cognitive-skill conversion. I cross-referenced IEA PIRLS 2021 and TIMSS 2023 achievement data with World Bank and Kosovo labor-market data to work out why, across socioeconomic conditions, multi-shift schooling bottlenecks, curriculum, and brain drain, and proposed a policy roadmap.</p>
                    <p class="research-links"><a href="/assets/Kosovo_Education_Analysis.pdf" target="_blank" rel="noopener noreferrer">Read the analysis (PDF)</a></p>
                </li>

                <li class="research-item scroll-fade">
                    <div class="research-meta">
                        <span class="research-venue">Independent</span>
                        <span class="research-status">August 2026</span>
                    </div>
                    <h2 class="research-title">AI Safety Evaluation: Uncensored vs. Baseline Model Benchmarking</h2>
                    <p class="research-summary">Ran a local reimplementation of Vending-Bench Mini alongside AgentHarm, StrongREJECT, and WMDP, comparing an uncensored open-weight model (Gemma-4 26B) against its stock baseline, with Gemini as judge under fixed hardware constraints. The abliterated model did worse at the actual task: it went out of business in every trial, against roughly 50% of trials for the stock model. Manual weight surgery on the refusal vector costs more than refusal behavior.</p>
                </li>
            </ol>

            <p class="research-footnote max-w-4xl mx-auto scroll-fade">Preprints and profiles: <a href="https://openreview.net/profile?id=%7ESai_Vinith_Ayapilla1" target="_blank" rel="noopener noreferrer">OpenReview</a></p>
